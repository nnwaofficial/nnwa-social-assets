<!doctype html>
<html><head><meta charset="utf-8">
<!-- NNWA motion reel engine v2. Deterministic: window.seek(t) draws the frame at t seconds; render.js captures 30 fps. -->
<style>
@font-face{font-family:Poppins;src:url(fonts/Poppins-Light.ttf);font-weight:300}
@font-face{font-family:Poppins;src:url(fonts/Poppins-Regular.ttf);font-weight:400}
@font-face{font-family:Poppins;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:Poppins;src:url(fonts/Poppins-SemiBold.ttf);font-weight:600}
@font-face{font-family:Poppins;src:url(fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:Poppins;src:url(fonts/Poppins-ExtraBold.ttf);font-weight:800}
@font-face{font-family:Fraunces;src:url(fonts/Fraunces-Italic-Variable.ttf);font-style:italic;font-weight:100 900}
@font-face{font-family:Fraunces;src:url(fonts/Fraunces-Variable.ttf);font-style:normal;font-weight:100 900}
:root{--forest:#123A2F;--deep:#0B241D;--green:#1F5C4C;--brass:#C8A04B;--lbrass:#E4C77E;--paper:#FBF8F1;--sage:#E3ECE6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--deep)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Poppins,sans-serif;color:var(--paper);-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;overflow:hidden;background:var(--deep);display:none}
.bg{position:absolute;left:-90px;top:-160px;width:1260px;height:2240px;background-size:cover;background-position:center;will-change:transform}
.shade{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(11,36,29,.70) 0%,rgba(11,36,29,.10) 22%,rgba(11,36,29,.20) 42%,rgba(11,36,29,.86) 66%,rgba(11,36,29,.97) 100%)}
.tint{position:absolute;inset:0;background:var(--forest);mix-blend-mode:color;opacity:.28}
.leak{position:absolute;width:1400px;height:1400px;border-radius:50%;background:radial-gradient(circle,rgba(228,199,126,.55) 0%,rgba(200,160,75,.18) 35%,rgba(200,160,75,0) 65%);mix-blend-mode:screen;pointer-events:none}
.content{position:absolute;left:96px;right:96px;bottom:430px}
.over{display:flex;align-items:center;gap:22px;font-size:24px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--lbrass);margin-bottom:34px;height:30px}
.over .rule{height:3px;background:var(--brass);width:0}
.over .ot{white-space:nowrap}
.head{font-size:104px;font-weight:600;line-height:1.02;letter-spacing:-.035em}
.head.small{font-size:84px}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .02em .14em;margin-bottom:-.14em}
.wi{display:inline-block;will-change:transform}
em{font-family:Fraunces,serif;font-style:italic;font-weight:400;color:var(--lbrass);letter-spacing:-.01em;font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 144}
.sub{margin-top:34px;font-size:36px;font-weight:400;line-height:1.35;color:rgba(251,248,241,.86);max-width:820px}
.num-row{display:flex;align-items:flex-end;gap:18px;line-height:.8;margin-bottom:28px}
.pre{font-size:34px;font-weight:500;letter-spacing:.02em;color:rgba(251,248,241,.8);margin-bottom:16px}
.num{font-size:300px;font-weight:700;letter-spacing:-.065em;font-variant-numeric:tabular-nums;line-height:.8;white-space:nowrap}
.unit{font-family:Fraunces,serif;font-style:italic;font-size:130px;color:var(--lbrass);line-height:.9;font-variation-settings:"SOFT" 100,"opsz" 144;padding-bottom:6px}
.bar{position:absolute;left:96px;right:96px;height:3px;background:rgba(251,248,241,.18)}
.bar i{display:block;height:100%;width:0;background:var(--brass)}
.idx{position:absolute;right:96px;top:250px;font-family:Fraunces,serif;font-style:italic;font-size:64px;color:var(--lbrass);font-variation-settings:"opsz" 144}
.idx small{font-family:Poppins;font-style:normal;font-size:24px;color:rgba(251,248,241,.6);letter-spacing:.2em;margin-left:10px}
.ghost{position:absolute;left:-30px;top:330px;font-size:520px;font-weight:800;letter-spacing:-.07em;color:transparent;-webkit-text-stroke:2px rgba(228,199,126,.22);white-space:nowrap;line-height:1}
.list{display:flex;flex-direction:column;gap:0;margin-top:6px}
.li{display:flex;align-items:baseline;gap:30px;padding:30px 0;border-top:2px solid rgba(251,248,241,.18);font-size:110px;font-weight:700;letter-spacing:-.04em;line-height:1}
.li .n{font-family:Fraunces,serif;font-style:italic;font-weight:400;font-size:48px;color:var(--lbrass);width:70px}
.plate{position:absolute;left:50%;top:330px;width:620px;height:620px;margin-left:-310px}
.plate svg{width:100%;height:100%;overflow:visible}
.print{position:absolute;left:96px;top:290px;width:888px;height:507px;background-size:cover;background-position:center;border:2px solid rgba(228,199,126,.7);box-shadow:0 40px 90px rgba(0,0,0,.45);will-change:transform}
.bg.soft{filter:blur(28px) brightness(.8)}
.brand{position:absolute;left:96px;top:112px;height:56px;opacity:.95}
.brand img{height:56px}
.site{position:absolute;right:96px;top:122px;font-size:26px;font-weight:500;letter-spacing:.06em;color:rgba(251,248,241,.8)}
.grain{position:absolute;inset:-100px;opacity:.10;mix-blend-mode:overlay;pointer-events:none;background-size:256px 256px}
.wipe{position:absolute;left:0;right:0;height:2300px;top:0;pointer-events:none;display:none}
/* end card */
.end{background:radial-gradient(120% 80% at 50% 30%,#1F5C4C 0%,#123A2F 45%,#0B241D 100%)}
.rings{position:absolute;left:50%;top:640px;width:0;height:0}
.ring{position:absolute;border:2px solid rgba(228,199,126,.35);border-radius:50%}
.end .seal{position:absolute;left:50%;top:520px;width:220px;height:220px;margin-left:-110px}
.end .content{bottom:auto;top:820px;text-align:center;left:80px;right:80px}
.end .over{justify-content:center}
.url{margin-top:60px;display:inline-flex;align-items:center;gap:6px;font-size:96px;font-weight:700;letter-spacing:-.04em;color:var(--paper)}
.url .cur{display:inline-block;width:6px;height:90px;background:var(--brass);margin-left:8px}
.urlbox{position:relative;display:inline-block;padding:18px 44px;}
.urlbox .ul{position:absolute;left:44px;right:44px;bottom:8px;height:6px;background:var(--brass);transform-origin:left;transform:scaleX(0)}
.bio{margin-top:34px;font-size:30px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--lbrass)}
.dust{position:absolute;inset:0;pointer-events:none}
.dust i{position:absolute;border-radius:50%;background:rgba(228,199,126,.75);box-shadow:0 0 12px rgba(228,199,126,.6)}
.spark{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.spark svg{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;color:var(--lbrass);opacity:0}
.numline{height:6px;background:var(--brass);transform-origin:left;transform:scaleX(0);margin:-10px 0 26px;width:300px}
.brand{overflow:hidden}
.brand .sh{position:absolute;top:-20px;bottom:-20px;width:120px;background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.85) 50%,rgba(255,255,255,0) 100%);mix-blend-mode:overlay;transform:skewX(-20deg)}
.bar b{position:absolute;top:-6px;width:15px;height:15px;margin-left:-7px;border-radius:50%;background:var(--lbrass);box-shadow:0 0 18px 4px rgba(228,199,126,.7)}
.li .ck{width:64px;height:64px;margin-left:auto;align-self:center}
.li .ck path{fill:none;stroke:var(--lbrass);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60}
.flash{position:absolute;inset:0;background:#FFF6DE;pointer-events:none;z-index:1000;opacity:0;mix-blend-mode:screen}
.sub .w{padding-bottom:.1em;margin-bottom:-.1em}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,H=1920,FPS=30;
const BPM=120,BEAT=60/BPM;          // music grid: every scene starts on a beat
const TR=0.5;                       // transition length (one beat)
const DUR={title:3.5,stat:3.5,list:4.0,plate:4.0,end:4.5};
const SPARK='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 0c.6 6.4 5.6 11.4 12 12-6.4.6-11.4 5.6-12 12-.6-6.4-5.6-11.4-12-12C6.4 11.4 11.4 6.4 12 0z"/></svg>';
function rnd(seed){let s=seed*9301+49297;return()=>((s=(s*16807)%2147483647)/2147483647)}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease={
  outExpo:p=>p>=1?1:1-Math.pow(2,-10*p),
  outCubic:p=>1-Math.pow(1-p,3),
  inOutCubic:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  inOutQuint:p=>p<.5?16*p*p*p*p*p:1-Math.pow(-2*p+2,5)/2,
  outBack:p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)},
  inCubic:p=>p*p*p,
};
const prog=(t,start,len)=>clamp((t-start)/len);
const PX=id=>typeof id==='string'?id:`https://images.pexels.com/photos/${id}/pexels-photo-${id}.jpeg?auto=compress&cs=tinysrgb&w=1400`;

// seeded noise for grain
function noiseURL(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const d=x.createImageData(256,256);
  let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
  x.putImageData(d,0,0);return c.toDataURL()}

function words(html,cls){ // wrap each word (keeping <em>) in mask spans
  const tmp=document.createElement('div');tmp.innerHTML=html;const out=[];
  // groups of inline pieces; punctuation glued to the previous word so it never wraps alone
  let cur=null;const flush=()=>{if(cur){out.push(`<span class="w"><span class="wi">${cur}</span></span>`);cur=null}};
  tmp.childNodes.forEach(n=>{
    if(n.nodeType===3){n.textContent.split(/(\s+)/).forEach(w=>{if(!w)return;if(/^\s+$/.test(w)){flush();out.push(' ');return}cur=(cur||'')+w;})}
    else{cur=(cur||'')+`<em>${n.innerHTML}</em>`}
  });flush();return `<div class="${cls}">${out.join('')}</div>`;
}

let SC=[],TOTAL=0,GRAIN='';
function build(spec){
  const st=document.getElementById('stage');st.innerHTML='';GRAIN=noiseURL();SC=[];let t=0;
  const nStat=spec.filter(s=>s.idx).length;
  spec.forEach((s,i)=>{
    const d=DUR[s.kind];const el=document.createElement('div');el.className='scene'+(s.kind==='end'?' end':'');
    let h='';
    if(s.kind!=='end'){
      const local=typeof s.photo==='string';
      h+=`<div class="bg${local?' soft':''}" style="background-image:url('${PX(s.photo)}')"></div><div class="tint"></div><div class="shade"></div><div class="leak"></div><div class="dust">${Array.from({length:16},()=>'<i></i>').join('')}</div>`;
      if(local)h+=`<div class="print" style="background-image:url('${PX(s.photo)}')"></div>`;
      if(s.kind==='stat')h+=`<div class="ghost">${s.num}</div>`;
      if(s.kind==='stat'&&s.idx)h+=`<div class="idx">${s.idx}<small>/ 0${nStat}</small></div>`;
      if(s.kind==='plate')h+=`<div class="plate"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="rgba(11,36,29,.45)" stroke="rgba(251,248,241,.35)" stroke-width="1.2"/>
        <path class="half" d="M100 8 A92 92 0 0 1 100 192 Z" fill="rgba(200,160,75,.85)"/><circle class="arc" cx="100" cy="100" r="92" fill="none" stroke="#E4C77E" stroke-width="3" stroke-dasharray="578" stroke-dashoffset="578" transform="rotate(-90 100 100)"/>
        <line class="split" x1="100" y1="8" x2="100" y2="192" stroke="#FBF8F1" stroke-width="2"/><text class="pl" x="150" y="106" text-anchor="middle" font-family="Poppins" font-weight="600" font-size="13" fill="#0B241D">VEG + FRUIT</text>
        <text class="pr" x="52" y="106" text-anchor="middle" font-family="Fraunces" font-style="italic" font-size="20" fill="#E4C77E">half?</text></svg></div>`;
      h+=`<div class="content">`;
      h+=`<div class="over"><span class="rule"></span><span class="ot">${s.over||''}</span></div>`;
      if(s.kind==='stat'){
        if(s.pre)h+=`<div class="pre">${s.pre}</div>`;
        h+=`<div class="num-row"><span class="w"><span class="wi num" data-num="${s.num}">${s.num}</span></span><span class="w"><span class="wi unit">${s.unit}</span></span></div><div class="numline"></div>`;
        h+=words(s.head,'head small');
      }else if(s.kind==='list'){
        h+=`<div class="list">${s.items.map((x,k)=>`<div class="li"><span class="n">0${k+1}</span><span>${x}</span><svg class="ck" viewBox="0 0 40 40"><path d="M8 21l8 8 16-17"/></svg></div>`).join('')}</div>`;
      }else{
        h+=words(s.head,'head');
      }
      if(s.sub)h+=words(s.sub,'sub');
      h+=`<div class="spark">${Array.from({length:8},()=>SPARK).join('')}</div></div>`;
      h+=`<div class="brand"><img src="assets/nnwa-wordmark-white.png"><span class="sh"></span></div><div class="site">nnwa.in</div>`;
      h+=`<div class="bar" style="bottom:380px"><i></i><b></b></div>`;
    }else{
      h+=`<div class="rings">${[0,1,2,3,4].map(k=>`<div class="ring"></div>`).join('')}</div><div class="leak"></div>
        <img class="seal" src="assets/nnwa-seal.png"><div class="dust">${Array.from({length:22},()=>'<i></i>').join('')}</div>
        <div class="content"><div class="over"><span class="rule"></span><span class="ot">Free on our website</span><span class="rule r2"></span></div>
        ${words('Free tools and <em>guides</em>.','head')}<div class="spark">${Array.from({length:8},()=>SPARK).join('')}</div>
        <div class="sub" style="margin-left:auto;margin-right:auto">Calculators, guides and 100% online courses.</div>
        <div class="urlbox"><div class="url"><span class="typed"></span><span class="cur"></span></div><div class="ul"></div></div>
        <div class="bio">Link in bio</div></div>`;
    }
    h+=`<div class="grain" style="background-image:url(${GRAIN})"></div>`;
    el.innerHTML=h;el.style.zIndex=i+1;st.appendChild(el);
    SC.push({s,el,start:t,dur:d,i});t+=d-TR;
  });
  TOTAL=t+TR; // last scene ends at its start+dur
  // transition wipe panels
  const wp=document.createElement('div');wp.className='wipe';wp.innerHTML=`<div style="height:180px;background:var(--brass)"></div><div style="height:2120px;background:var(--forest)"></div>`;
  wp.style.zIndex=999;st.appendChild(wp);
  const fl=document.createElement('div');fl.className='flash';st.appendChild(fl);
  // dust particles: deterministic positions per scene
  SC.forEach(o=>{const r=rnd(o.i+3);o.el.querySelectorAll('.dust i').forEach(d=>{const z=r();d._p={x:r()*W,y:r()*H,sz:3+z*7,sp:30+z*90,ph:r()*6.28};d.style.width=d.style.height=d._p.sz+'px';});});
  return TOTAL;
}

function fmt(target,p){ // count-up keeping decimals and ranges
  return target.split('–').map(part=>{const dec=(part.split('.')[1]||'').length;const v=parseFloat(part)*p;return v.toFixed(dec)}).join('–');
}

const beatPulse=t=>Math.exp(-((t+1e-6)%BEAT)/0.09);
function drawDust(o,lt){o.el.querySelectorAll('.dust i').forEach(d=>{const p=d._p;const y=((p.y-p.sp*lt)%H+H)%H;d.style.transform=`translate3d(${p.x+18*Math.sin(lt*1.3+p.ph)}px,${y}px,0)`;d.style.opacity=(0.25+0.5*Math.abs(Math.sin(lt*2+p.ph)))*clamp(lt*2);});}
function burst(el,anchor,lt,t0){ // eight brass sparkles fly out from an element when it lands
  const sp=el.querySelector('.spark');if(!sp||!anchor)return;const box=sp.parentElement.getBoundingClientRect(),a=anchor.getBoundingClientRect();
  sp.style.left=(a.left-box.left+a.width*0.55)+'px';sp.style.top=(a.top-box.top+a.height*0.45)+'px';
  sp.querySelectorAll('svg').forEach((g,k)=>{const p=prog(lt,t0+k*0.012,0.75);const e=ease.outExpo(p);const ang=k/8*6.283+0.4;const rad=60+e*(110+(k%3)*40);
    g.style.opacity=p>0&&p<1?(1-p)*1.1:0;g.style.transform=`translate(${Math.cos(ang)*rad}px,${Math.sin(ang)*rad}px) rotate(${e*180}deg) scale(${(k%2?0.55:0.9)*(0.4+0.8*Math.sin(Math.PI*clamp(p*1.2)))})`;});
}
const T0={title:0,stat:0.55,list:0,plate:0,end:0}; // head word start offset per kind
function drawScene(o,lt){
  const {s,el,dur}=o;const q=sel=>el.querySelector(sel),qa=sel=>el.querySelectorAll(sel);const gt=o.start+lt,bp=beatPulse(gt);
  drawDust(o,lt);
  const exitP=ease.inCubic(prog(lt,dur-TR-0.15,0.5)); // words leave as next scene arrives
  // background parallax: slow push-in and drift
  const bg=q('.bg');if(bg){const p=lt/(dur+1);bg.style.transform=`translate3d(0,${-40*p}px,0) scale(${(1.16-0.12*ease.outCubic(clamp(p)))*(1+0.012*bp)})`;}
  const pr=q('.print');if(pr){const p=ease.outExpo(prog(lt,0.1,1.1));pr.style.opacity=clamp(p*1.5)*(1-exitP);
    pr.style.transform=`translate3d(0,${(1-p)*160-exitP*120}px,0) rotate(${(1-p)*-8+1.5*Math.sin(lt*0.8)}deg) scale(${0.9+0.1*p+0.02*lt/dur})`;}
  const lk=q('.leak');if(lk){const a=(o.i*1.3+lt*0.35);lk.style.transform=`translate(${-300+420*Math.cos(a)}px,${200+300*Math.sin(a*0.8)}px)`;lk.style.opacity=0.5+0.2*Math.sin(lt*1.7+o.i)+0.25*bp;}
  const gr=q('.grain');if(gr){const f=Math.floor(lt*24);gr.style.backgroundPosition=`${(f*73)%256}px ${(f*151)%256}px`;}
  const brand=q('.brand'),site=q('.site');if(brand){const p=ease.outExpo(prog(lt,0.1,0.8));brand.style.opacity=p;site.style.opacity=p*0.8;
    const sh=q('.brand .sh');sh.style.transform=`translateX(${-160+ease.inOutCubic(prog(lt,0.5,0.9))*720}px) skewX(-20deg)`;}
  const bar=q('.bar i');if(bar){const w=100*clamp(lt/dur);bar.style.width=w+'%';const dot=q('.bar b');dot.style.left=w+'%';dot.style.transform=`scale(${0.8+0.6*bp})`;}
  // overline: rule draws, letters track in
  const r=s.kind==='end'?null:q('.over .rule');if(r){const p=ease.outExpo(prog(lt,0.15,0.9));qa('.over .rule').forEach(x=>x.style.width=(72*p)+'px');
    const ot=q('.over .ot');const p2=ease.outExpo(prog(lt,0.25,1.0));ot.style.opacity=p2*(1-exitP);ot.style.letterSpacing=(0.6-0.36*p2)+'em';}
  // words: masked rise with slight rotation, staggered; exit upward
  const ws=s.kind==='end'?[]:qa('.head .wi');ws.forEach((w,k)=>{
    const p=ease.outExpo(prog(lt,0.35+k*0.075+(s.kind==='stat'?0.55:0),0.95));
    const e=ease.inCubic(prog(lt,dur-TR-0.25+k*0.025,0.45));
    w.style.transform=`translate3d(0,${(1-p)*115-e*115}%,0) rotate(${(1-p)*7}deg)`;
  });
  // emphasis word: Fraunces weight + softness morph
  (s.kind==='end'?[]:qa('.head em')).forEach((m,k)=>{const p=ease.inOutCubic(prog(lt,0.7+(s.kind==='stat'?0.55:0),1.4));
    m.style.fontVariationSettings=`"wght" ${300+300*p}, "SOFT" ${100*p}, "WONK" 1, "opsz" 144`;});
  // stat number: mask-rise then count up
  const num=q('.num');if(num){const p=ease.outExpo(prog(lt,0.25,0.9));const c=ease.outCubic(prog(lt,0.3,1.5));
    const land=lt>1.8?0.09*Math.exp(-(lt-1.8)*11)*Math.cos((lt-1.8)*22):0;
    num.style.transform=`translate3d(0,${(1-p)*100-exitP*110}%,0) scale(${1+land})`;num.style.transformOrigin='left bottom';num.textContent=fmt(num.dataset.num,c);
    const nl=q('.numline');nl.style.transform=`scaleX(${ease.outExpo(prog(lt,1.75,0.6))*(1-exitP)})`;
    num.style.textShadow=lt>1.8?`0 0 ${40*Math.exp(-(lt-1.8)*4)}px rgba(228,199,126,.9)`:'none';
    const u=q('.unit');const pu=ease.outBack(prog(lt,1.0,0.7));u.style.transform=`translate3d(0,${(1-clamp(pu))*100-exitP*110}%,0)`;u.style.opacity=clamp(pu*2);
    const pre=q('.pre');if(pre){const pp=ease.outExpo(prog(lt,0.15,0.8));pre.style.opacity=pp*(1-exitP);pre.style.transform=`translateX(${(1-pp)*-40}px)`;}
    const g=q('.ghost');const pg=lt/dur;g.style.transform=`translateX(${120-260*pg}px)`;g.style.opacity=ease.outCubic(prog(lt,0.2,1.2))*(1-exitP);}
  const idx=q('.idx');if(idx){const p=ease.outExpo(prog(lt,0.2,0.9));idx.style.opacity=p*(1-exitP);idx.style.transform=`perspective(600px) rotateX(${(1-p)*90}deg)`;}
  // list: items stamp in one by one with a rule sweep
  qa('.li').forEach((li,k)=>{const p=ease.outExpo(prog(lt,0.4+k*0.38,0.8));li.style.opacity=clamp(p*1.4)*(1-exitP);
    li.style.transform=`translate3d(${(1-p)*120}px,0,0)`;li.style.borderTopColor=`rgba(228,199,126,${0.15+0.5*p})`;
    li.querySelector('.ck path').style.strokeDashoffset=60*(1-ease.outCubic(prog(lt,0.6+k*0.38,0.35)));});
  // plate graphic
  const pl=q('.plate');if(pl){const p=ease.outBack(prog(lt,0.15,0.9));pl.style.transform=`scale(${0.6+0.4*clamp(p,0,1.2)}) rotate(${(1-clamp(p))*-25}deg)`;pl.style.opacity=clamp(p*1.5)*(1-exitP);
    const arc=q('.arc');arc.style.strokeDashoffset=578*(1-ease.inOutCubic(prog(lt,0.4,1.2)));
    const half=q('.half');const ph=ease.outExpo(prog(lt,1.1,0.8));half.style.opacity=ph;half.style.transformOrigin='100px 100px';half.style.transform=`scale(${0.85+0.15*ph})`;
    q('.split').style.opacity=ph;q('.pl').style.opacity=ph;q('.pr').style.opacity=ease.outExpo(prog(lt,1.6,0.8));}
  // sub: blur-in
  const sub=q('.sub');if(sub&&s.kind!=='end'){const t0=(s.kind==='stat'?1.5:1.05)+(s.kind==='list'?0.8:0);sub.style.opacity=1-exitP;
    sub.querySelectorAll('.wi').forEach((w,k)=>{const p=ease.outExpo(prog(lt,t0+k*0.035,0.7));w.style.transform=`translate3d(0,${(1-p)*100}%,0)`;w.style.opacity=p;});}
  const emEl=s.kind==='end'?null:q('.head em');if(emEl)burst(el,emEl,lt,0.7+T0[s.kind]+0.45);
  if(s.kind==='end')drawEnd(o,lt);
}

function drawEnd(o,lt){
  const el=o.el,q=sel=>el.querySelector(sel),qa=sel=>el.querySelectorAll(sel);
  qa('.ring').forEach((r,k)=>{const p=((lt*0.32+k/5)%1);const d=160+p*1500;r.style.width=r.style.height=d+'px';r.style.left=r.style.top=(-d/2)+'px';r.style.opacity=(1-p)*clamp(lt*2);});
  const lk=q('.leak');lk.style.transform=`translate(${-160+200*Math.sin(lt*0.6)}px,${-200+120*Math.cos(lt*0.5)}px)`;lk.style.opacity=.6;
  const seal=q('.seal');const ps=ease.outBack(prog(lt,0.1,0.9));seal.style.transform=`scale(${clamp(ps,0,1.3)}) rotate(${(1-clamp(ps))*-90}deg)`;seal.style.opacity=clamp(ps*2);
  drawDust(o,lt);const bp=beatPulse(o.start+lt);
  qa('.head .wi').forEach((w,k)=>{const p=ease.outExpo(prog(lt,0.35+k*0.075,0.95));w.style.transform=`translate3d(0,${(1-p)*115}%,0) rotate(${(1-p)*7}deg)`;});
  qa('.head em').forEach(m=>{const p=ease.inOutCubic(prog(lt,0.7,1.4));m.style.fontVariationSettings=`"wght" ${300+300*p}, "SOFT" ${100*p}, "WONK" 1, "opsz" 144`;});
  burst(el,q('.head em'),lt,1.15);
  q('.over .ot').style.opacity=ease.outExpo(prog(lt,0.25,1.0));qa('.over .rule').forEach(x=>x.style.width=(72*ease.outExpo(prog(lt,0.15,0.9)))+'px');
  seal.style.filter=`drop-shadow(0 0 ${20+40*bp}px rgba(228,199,126,${0.3+0.4*bp}))`;
  const sub=q('.sub');sub.querySelectorAll('.wi').forEach((w,k)=>{const p=ease.outExpo(prog(lt,1.0+k*0.035,0.7));w.style.transform=`translate3d(0,${(1-p)*100}%,0)`;w.style.opacity=p;});
  const url='nnwa.in';const n=Math.floor(clamp((lt-1.5)/0.6)*url.length);q('.typed').textContent=url.slice(0,n);q('.url').style.transform=`scale(${1+0.025*Math.exp(-(((lt-1.5)%(0.6/7))+0)/0.03)*(lt>1.5&&lt<2.1?1:0)})`;
  q('.cur').style.opacity=(lt<1.4)?0:((Math.floor(lt*2.5)%2)?0.15:1);
  q('.ul').style.transform=`scaleX(${ease.outExpo(prog(lt,2.2,0.8))})`;
  const b=q('.bio');const pb=ease.outExpo(prog(lt,2.5,0.8));b.style.opacity=pb;b.style.letterSpacing=(0.5-0.28*pb)+'em';
}

// transitions: 0 circle reveal, 1 brass/forest panel wipe, 2 inset slide-up with scale-back of outgoing
function transition(o,prev,p,kind){
  const el=o.el;const wp=document.querySelector('.wipe');
  if(kind===0){const e=ease.inOutQuint(p);el.style.clipPath=`circle(${e*140}% at 50% 62%)`;if(prev)prev.el.style.transform=`scale(${1+0.06*e})`;}
  else if(kind===1){const e=ease.inOutQuint(p);wp.style.display='block';wp.style.transform=`translateY(${H-e*(H+2400)}px)`;el.style.clipPath=p>0.5?'none':'inset(0 0 100% 0)';}
  else{const e=ease.inOutQuint(p);el.style.clipPath=`inset(${(1-e)*100}% 0 0 0)`;el.style.transform=`translateY(${(1-e)*240}px)`;
    if(prev){prev.el.style.transform=`scale(${1-0.08*e}) translateY(${-e*120}px)`;prev.el.style.filter=`brightness(${1-0.6*e})`;}}
}

function seek(t){
  const wp=document.querySelector('.wipe');wp.style.display='none';
  let fl=0;SC.forEach((o,i)=>{if(i>0){const d=t-(o.start+TR*0.5);if(d>=0)fl=Math.max(fl,0.22*Math.exp(-d*9));}});document.querySelector('.flash').style.opacity=fl;
  SC.forEach((o,i)=>{
    const lt=t-o.start;const vis=lt>=0&&lt<=o.dur;o.el.style.display=vis?'block':'none';
    o.el.style.clipPath='none';o.el.style.transform='none';o.el.style.filter='none';
  });
  SC.forEach((o,i)=>{
    const lt=t-o.start;if(lt<0||lt>o.dur)return;
    drawScene(o,lt);
    if(i>0&&lt<TR){const kind=o.s.kind==='end'?0:(i%3);transition(o,SC[i-1],lt/TR,kind);}
  });
}

async function ready(){
  await document.fonts.ready;
  const urls=[...document.querySelectorAll('.bg')].map(b=>b.style.backgroundImage.slice(5,-2));
  await Promise.all([...new Set(urls)].map(u=>new Promise(r=>{const i=new Image();i.onload=i.onerror=()=>r();i.src=u;}))) ;
  await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));
  // force font faces used
  await Promise.all(['300','400','500','600','700','800'].map(w=>document.fonts.load(`${w} 40px Poppins`)).concat([document.fonts.load('italic 400 40px Fraunces')]));
  return true;
}
// sound events, same timing as the animation (render.js hands these to audio.py)
function events(){
  const ev=[];const add=(t,type,v)=>ev.push({t:+t.toFixed(3),type,v:v||0});
  SC.forEach((o,i)=>{const s=o.s,t=o.start,el=o.el;
    if(i===0)add(0,'hit');else{add(t-0.12,'whoosh',i%3);add(t+TR*0.5,'impact');}
    if(s.kind==='end'){add(t+0.15,'chime');el.querySelectorAll('.head .wi').forEach((w,k)=>add(t+0.4+k*0.075,'tick',k));add(t+1.15,'sparkle');
      for(let j=0;j<7;j++)add(t+1.5+j*0.6/7,'key',j);add(t+2.2,'swish');add(t+2.5,'tick',3);return;}
    add(t+0.2,'tick',0);
    const off=T0[s.kind];el.querySelectorAll('.head .wi').forEach((w,k)=>add(t+0.42+k*0.075+off,'tick',k+1));
    if(el.querySelector('.head em'))add(t+0.7+off+0.45,'sparkle');
    if(s.kind==='stat'){for(let k=0;k<14;k++)add(t+0.3+k*0.1,'count',k);add(t+1.0+0.25,'pop',1);add(t+1.8,'land');}
    if(s.kind==='list')s.items.forEach((x,k)=>{add(t+0.45+k*0.38,'thock',k);add(t+0.75+k*0.38,'check',k);});
    if(s.kind==='plate'){add(t+0.4,'rise');add(t+1.15,'pop',2);}
    if(s.sub)add(t+(s.kind==='stat'?1.5:1.05)+(s.kind==='list'?0.8:0),'soft');
  });
  return ev.sort((a,b)=>a.t-b.t);
}
window.events=events;window.build=build;window.seek=seek;window.ready=ready;
</script></body></html>
